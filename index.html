function drawMap() {
  const old = document.getElementById("mapPage");
  if (old) old.remove();
  document.body.classList.toggle("map-open", state.mapOpen);
  if (!state.mapOpen) return;
  const colors = { Vision: "#e2b000", Exploration: "#d4145a", Incubation: "#2b6fd6", Cultivation: "#2f9e38" };
  const page = document.createElement("div");
  page.id = "mapPage";
  page.className = "map-page";
  page.innerHTML = `
    <div class="map-stage"><img class="map" alt="Printed Wheel of Creativity" src="images/printed-wheel.png"><svg viewBox="0 0 1253 1253"></svg></div>
    <div class="map-action" id="mapIllum" role="button" tabindex="0">See illumination</div>
    <div class="map-nav" style="position:fixed; left:0; right:0; bottom:72px; z-index:100; display:flex; justify-content:space-around; padding:0 16px; gap:16px;">
      <button type="button" id="mapBackBtn">Back</button>
      <button type="button" id="mapRestartBtn">Start over</button>
    </div>
  `;
  const svg = page.querySelector("svg");
  const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
  svg.appendChild(defs);
  STATIONS.forEach((item, i) => {
    const cx = 626, cy = 626, r0 = 468, r1 = 590;
    const a1 = (90 - i * 30) * Math.PI / 180;
    const a0 = a1 - 30 * Math.PI / 180;
    const pt = (a, r) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const [x0, y0] = pt(a0, r1);
    const [x1, y1] = pt(a1, r1);
    const [x2, y2] = pt(a1, r0);
    const [x3, y3] = pt(a0, r0);
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const d = "M " + x0 + " " + y0 + " A " + r1 + " " + r1 + " 0 0 1 " + x1 + " " + y1 + " L " + x2 + " " + y2 + " A " + r0 + " " + r0 + " 0 0 0 " + x3 + " " + y3 + " Z";
    path.setAttribute("d", d);
    if (state.mapLit === item.id) {
      const clip = document.createElementNS("http://www.w3.org/2000/svg", "clipPath");
      clip.id = "stationClip";
      clip.setAttribute("clipPathUnits", "userSpaceOnUse");
      const clipPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      clipPath.setAttribute("d", d);
      clip.appendChild(clipPath);
      defs.appendChild(clip);
      const lit = document.createElementNS("http://www.w3.org/2000/svg", "image");
      lit.setAttribute("href", "images/printed-wheel-color.png");
      lit.setAttribute("width", "1253");
      lit.setAttribute("height", "1253");
      lit.setAttribute("clip-path", "url(#stationClip)");
      lit.setAttribute("pointer-events", "none");
      svg.appendChild(lit);
    }
    path.setAttribute("aria-label", item.name);
    path.style.pointerEvents = "none";
    svg.appendChild(path);
  });
  document.body.appendChild(page);
  const stage = page.querySelector(".map-stage");
  let scale = 1, tx = 0, ty = 0;
  let startDist = 0, startScale = 1, startTx = 0, startTy = 0;
  let panStartX = 0, panStartY = 0, isPanning = false;
  const dist = (touches) => {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx, dy) || 1;
  };
  const apply = () => {
    const maxPan = (scale - 1) * 0.5 * Math.min(window.innerWidth, window.innerHeight);
    tx = Math.max(-maxPan, Math.min(maxPan, tx));
    ty = Math.max(-maxPan, Math.min(maxPan, ty));
    stage.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    stage.style.transformOrigin = "center center";
  };
  page.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      startDist = dist(e.touches);
      startScale = scale;
      startTx = tx;
      startTy = ty;
      isPanning = false;
    } else if (e.touches.length === 1 && scale > 1.05) {
      isPanning = true;
      panStartX = e.touches[0].clientX - tx;
      panStartY = e.touches[0].clientY - ty;
    }
  }, { passive: true });
  page.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const newDist = dist(e.touches);
      scale = Math.min(5, Math.max(1, startScale * newDist / startDist));
      apply();
    } else if (e.touches.length === 1 && isPanning) {
      e.preventDefault();
      tx = e.touches[0].clientX - panStartX;
      ty = e.touches[0].clientY - panStartY;
      apply();
    }
  }, { passive: false });
  page.addEventListener("touchend", (e) => {
    isPanning = false;
    if (scale < 1.02) { scale = 1; tx = 0; ty = 0; apply(); }
  });
  page.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.min(5, Math.max(1, scale * delta));
    const rect = stage.getBoundingClientRect();
    const mx = e.clientX - rect.left - rect.width / 2;
    const my = e.clientY - rect.top - rect.height / 2;
    const factor = newScale / scale;
    tx = mx - (mx - tx) * factor;
    ty = my - (my - ty) * factor;
    scale = newScale;
    apply();
  }, { passive: false });
  let mousePanning = false, mouseStartX = 0, mouseStartY = 0;
  page.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || scale <= 1.05) return;
    mousePanning = true;
    mouseStartX = e.clientX - tx;
    mouseStartY = e.clientY - ty;
    page.style.cursor = "grabbing";
  });
  page.addEventListener("mousemove", (e) => {
    if (!mousePanning) return;
    tx = e.clientX - mouseStartX;
    ty = e.clientY - mouseStartY;
    apply();
  });
  page.addEventListener("mouseup", () => {
    mousePanning = false;
    page.style.cursor = "";
  });
  page.addEventListener("mouseleave", () => { mousePanning = false; page.style.cursor = ""; });
  document.getElementById("mapIllum").onclick = () => {
    state.mapOpen = false;
    state.history.push("map");
    go(5, false);
  };
  document.getElementById("mapBackBtn").onclick = back;
  document.getElementById("mapRestartBtn").onclick = restart;
}

function playVortex(done) {
  const layer = document.createElement("div");
  layer.className = "vortex";
  layer.setAttribute("aria-hidden", "true");
  layer.innerHTML = '<div class="vortex-wheel"><img alt="" src="images/wheel-mark.png"></div>';
  document.body.appendChild(layer);
  const wheel = layer.querySelector(".vortex-wheel");
  const img = layer.querySelector("img");
  const started = performance.now();
  const life = 1700;
  let angle = 0;
  let last = started;
  function frame(now) {
    if (!layer.isConnected) return;
    const t = Math.min(1, (now - started) / life);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const scale = 0.16 + t * 0.62;
    wheel.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
    const speed = 40 + t * t * 700;
    angle = (angle + speed * dt) % 360;
    img.style.transform = "rotate(" + angle + "deg)";
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => {
    document.body.classList.add("page-in");
    document.body.classList.remove("show-page");
    layer.classList.add("leave");
    done();
    requestAnimationFrame(() => {
      requestAnimationFrame(() => document.body.classList.add("show-page"));
    });
  }, 700);
  setTimeout(() => layer.remove(), 1700);
  setTimeout(() => {
    document.body.classList.remove("page-in");
    document.body.classList.remove("show-page");
  }, 3700);
}
function startFloat(stage) {
  const cards = Array.from(stage.querySelectorAll(".fcard"));
  if (state.floatTimer) cancelAnimationFrame(state.floatTimer);
  const gap = 18;
  function place() {
    const w = stage.clientWidth || 320;
    const h = stage.clientHeight || 420;
    const n = cards.length || 1;
    const cols = w < 520 ? 2 : 3;
    const rows = Math.ceil(n / cols);
    const size = Math.max(72, Math.min(168, Math.floor(Math.min((w - gap * (cols + 1)) / cols, (h - gap * (rows + 1)) / rows))));
    cards.forEach((card, i) => {
      card.style.width = size + "px";
      card.style.height = size + "px";
      const col = i % cols;
      const row = Math.floor(i / cols);
      const cellW = (w - gap) / cols;
      const cellH = (h - gap) / rows;
      const maxX = Math.max(0, w - size);
      const maxY = Math.max(0, h - size);
      const x = Math.min(maxX, gap + col * cellW + (cellW - size) / 2);
      const y = Math.min(maxY, gap * 0.35 + row * cellH);
      card.dataset.px = String(x);
      card.dataset.py = String(y);
      card.dataset.vx = String(((i % 5) - 2) * 0.35 || 0.4);
      card.dataset.vy = String((((i + 2) % 5) - 2) * 0.28 || -0.3);
      card.style.left = x + "px";
      card.style.top = y + "px";
    });
  }
  place();
  function step() {
    if (state.screen !== 3 || state.design !== 3) return;
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const size = cards[0] ? cards[0].offsetWidth : 120;
    const maxX = Math.max(0, w - size);
    const maxY = Math.max(0, h - size);
    const min = size + gap;
    cards.forEach(card => {
      if (card.classList.contains("caught") || state.spinning) return;
      let x = parseFloat(card.dataset.px);
      let y = parseFloat(card.dataset.py);
      let vx = parseFloat(card.dataset.vx);
      let vy = parseFloat(card.dataset.vy);
      const speed = Math.hypot(vx, vy);
      if (speed > 1.1) { vx *= 0.92; vy *= 0.92; }
      if (speed < 0.25) { vx *= 1.08; vy *= 1.08; }
      x += vx; y += vy;
      if (x < 0 || x > maxX) { vx *= -1; x = Math.max(0, Math.min(maxX, x)); }
      if (y < 0 || y > maxY) { vy *= -1; y = Math.max(0, Math.min(maxY, y)); }
      card.dataset.px = x; card.dataset.py = y; card.dataset.vx = vx; card.dataset.vy = vy;
    });
    for (let a = 0; a < cards.length; a++) {
      for (let b = a + 1; b < cards.length; b++) {
        const A = cards[a], B = cards[b];
        let ax = parseFloat(A.dataset.px), ay = parseFloat(A.dataset.py);
        let bx = parseFloat(B.dataset.px), by = parseFloat(B.dataset.py);
        let dx = bx - ax, dy = by - ay;
        let dist = Math.hypot(dx, dy) || 0.01;
        if (dist < min) {
          const push = (min - dist) / 2;
          const nx = dx / dist, ny = dy / dist;
          ax = Math.max(0, Math.min(maxX, ax - nx * push));
          ay = Math.max(0, Math.min(maxY, ay - ny * push));
          bx = Math.max(0, Math.min(maxX, bx + nx * push));
          by = Math.max(0, Math.min(maxY, by + ny * push));
          A.dataset.px = ax; A.dataset.py = ay;
          B.dataset.px = bx; B.dataset.py = by;

function enableCardZoom() {
  const stage = document.getElementById("recCard");
  if (!stage) return;
  let scale = 1, tx = 0, ty = 0;
  let startDist = 0, startScale = 1;
  let panStartX = 0, panStartY = 0, isPanning = false;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY) || 1;
  const apply = () => {
    const maxPan = (scale - 1) * 160;
    tx = Math.max(-maxPan, Math.min(maxPan, tx));
    ty = Math.max(-maxPan, Math.min(maxPan, ty));
    stage.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
  };
  stage.addEventListener("touchstart", (e) => {
    if (e.touches.length === 2) {
      startDist = dist(e.touches);
      startScale = scale;
      isPanning = false;
    } else if (e.touches.length === 1 && scale > 1.05) {
      isPanning = true;
      panStartX = e.touches[0].clientX - tx;
      panStartY = e.touches[0].clientY - ty;
    }
  }, { passive: true });
  stage.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      scale = Math.min(4, Math.max(1, startScale * dist(e.touches) / startDist));
      apply();
    } else if (e.touches.length === 1 && isPanning) {
      e.preventDefault();
      tx = e.touches[0].clientX - panStartX;
      ty = e.touches[0].clientY - panStartY;
      apply();
    }
  }, { passive: false });
  stage.addEventListener("touchend", () => {
    isPanning = false;
    if (scale < 1.02) { scale = 1; tx = 0; ty = 0; apply(); }
  });
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    scale = Math.min(4, Math.max(1, scale + (e.deltaY < 0 ? 0.15 : -0.15)));
    if (scale <= 1) { scale = 1; tx = 0; ty = 0; }
    apply();
  }, { passive: false });
}

  bgLayer.style.opacity = savedLayout.wheel.opacity || "0.2";
  bgLayer.style.transform = savedLayout.wheel.transform || "translate(-50%, -50%)";
  const size = parseFloat(savedLayout.wheel.width);
  if (size) document.getElementById("opacitySlider").value = Math.round((size - 20) / 1.6);
}
function textLineRects(el) {
  if (el.classList.contains("cardish")) return [el.getBoundingClientRect()];
  const range = document.createRange();
  range.selectNodeContents(el);
  const lines = [...range.getClientRects()].filter(r => r.width > 2 && r.height > 2);
  return lines.length ? lines : [el.getBoundingClientRect()];
}
function addGrabZones() {
  document.querySelectorAll(".grab-right").forEach(n => n.remove());
  if (state.screen !== 4) { syncWmGrab(); return; }
  document.querySelectorAll(".wrap .cardish").forEach(el => {
    if (getComputedStyle(el).position === "static") el.style.position = "relative";
    const host = el.getBoundingClientRect();
    const g = document.createElement("span");
    g.className = "grab-right";
    g.setAttribute("aria-hidden", "true");
    g.style.left = (host.width * 0.75) + "px";
    g.style.top = "0px";
    g.style.width = Math.max(16, host.width * 0.25) + "px";
    g.style.height = host.height + "px";
    el.appendChild(g);
  });
  syncWmGrab();
}
function syncWmGrab() {
  const grab = document.getElementById("wmGrab");
  if (!grab || !bgLayer) return;
  const r = bgLayer.getBoundingClientRect();
  grab.style.left = r.left + "px";
  grab.style.top = r.top + "px";
  grab.style.width = Math.max(28, r.width * 0.25) + "px";
  grab.style.height = r.height + "px";
}
document.addEventListener("pointerdown", (e) => {
  const el = canMove(e.target);
  if (!el || e.target.closest(".ver-banner, .settings")) return;
  const r = el.getBoundingClientRect();
  move = { el, x: e.clientX, y: e.clientY, left: r.left, top: r.top };
  el.style.position = "relative";
  e.preventDefault();
  e.stopPropagation();
});
document.addEventListener("pointermove", (e) => {
  if (!move) return;
  const dx = e.clientX - move.x, dy = e.clientY - move.y;
  move.el.style.left = dx + "px";
  move.el.style.top = dy + "px";
  const r = move.el.getBoundingClientRect();
  const mid = r.left + r.width / 2;
  const centered = Math.abs(mid - window.innerWidth / 2) < 8;
  guide.classList.toggle("on", centered);
  tag.classList.toggle("on", centered);
});
document.addEventListener("pointerup", () => { if (move) { saveStationLayout(); addGrabZones(); } move = null; guide.classList.remove("on"); tag.classList.remove("on"); });
function applyOpacity(value) {
  const o = value / 100;
  document.querySelectorAll("#scatter img").forEach(img => img.style.opacity = o);
  bgLayer.style.opacity = o;
  document.body.style.setProperty("--bg-opacity", o);
}
const slider = document.getElementById("opacitySlider");
const sliderLabel = document.getElementById("sliderLabel");
function selectedWheel() { return document.querySelector("#scatter img.sel") || document.querySelector("#bgLayer.sel"); }
slider.oninput = (e) => {
  const img = selectedWheel();
  if (!img) { applyOpacity(e.target.value); if (state.screen === 1) saveDoorLayout(); return; }
  if (img.id === "bgLayer") img.style.width = (20 + e.target.value * 1.6) + "vmin";
  else img.style.width = (24 + e.target.value * 1.4) + "px";
  if (state.screen === 1) saveDoorLayout();
  syncWmGrab();
};
function showSize(img) {
  sliderLabel.firstChild.textContent = "Size ";
  const n = parseFloat(img.style.width) || 70;
  slider.value = img.id === "bgLayer" ? Math.round((n - 20) / 1.6) : Math.round((n - 24) / 1.4);
}
function showOpacity() {
  sliderLabel.firstChild.textContent = "Opacity ";
}
document.getElementById("hideBtn").onclick = () => {
  const on = document.documentElement.getAttribute("data-hide") === "1";
  document.documentElement.setAttribute("data-hide", on ? "0" : "1");
  document.getElementById("hideBtn").textContent = on ? "Hide text" : "Show text";
};
function layoutKey(el, i) { return (el.id || el.textContent || "item").trim().slice(0, 40) + "-" + i; }
function layoutNodes() {
  return [...document.querySelectorAll(".wrap h1, .wrap p, .wrap button, .wrap .cardish, footer.tools button, footer.tools summary")]
    .filter(el => !el.closest(".cardish") || el.classList.contains("cardish"));
}
function captureItems() {
  return layoutNodes().map((el, i) => ({
    key: layoutKey(el, i), left: el.style.left || "", top: el.style.top || ""
  }));
}
function applyItems(items) {
  if (!items) return;
  layoutNodes().forEach((el, i) => {
    const hit = items.find(x => x.key === layoutKey(el, i));
    if (!hit) return;
    el.style.position = "relative";
    el.style.left = hit.left;
    el.style.top = hit.top;
  });
}
function presets() { return saved("woc-presets", []); }
function writePresets(list) { localStorage.setItem("woc-presets", JSON.stringify(list)); }
document.getElementById("diskBtn").onclick = (e) => {
  e.stopPropagation();
  let menu = document.getElementById("layoutMenu");
  if (menu) { menu.remove(); return; }
  menu = document.createElement("div");
  menu.id = "layoutMenu";
  menu.innerHTML = '<button type="button" id="savePreset">Save this layout</button><button type="button" id="showCoords">Show coordinates</button>';
  presets().forEach((item, i) => {
    menu.innerHTML += '<button type="button" data-load="' + i + '">' + item.name + '</button>';
  });
  document.body.appendChild(menu);
  menu.querySelector("#showCoords").onclick = async () => {
    const key = state.screen === 4 ? "woc-page-4" : "woc-page-1";
    const raw = localStorage.getItem(key) || (state.screen === 4 ? "No station-card layout saved yet." : JSON.stringify(captureDoorLayout()));
    let box = document.getElementById("coordBox");
    if (!box) {
      box = document.createElement("div");
      box.id = "coordBox";
      box.style.cssText = "position:fixed;left:12px;right:12px;bottom:96px;z-index:90;background:#fffaf3;color:#1c1612;padding:12px;border-radius:10px;text-align:left;";
      box.innerHTML = '<p id="coordNote" style="margin:0 0 8px;font:16px Georgia,serif;"></p><textarea id="coordText" readonly style="width:100%;height:140px;font:14px/1.4 ui-monospace,monospace;user-select:text;-webkit-user-select:text;"></textarea><button type="button" id="coordShare">Share coordinates</button>';
      document.body.appendChild(box);
      box.querySelector("#coordShare").onclick = async (ev) => {
        ev.stopPropagation();
        const text = box.querySelector("#coordText").value;
        if (navigator.share) {
          try { await navigator.share({ text }); return; } catch (err) {}
        }
        const field = box.querySelector("#coordText");
        field.focus();
        field.select();
      };
    }
    const field = box.querySelector("#coordText");
    const note = box.querySelector("#coordNote");
    field.value = raw;
    field.focus();
    field.select();
    let copied = false;
    try { copied = document.execCommand("copy"); } catch (err) {}
    if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(raw); copied = true; } catch (err) {}
    }
    note.textContent = copied ? "Copied. Paste it into the chat." : "If paste is empty, tap Share coordinates, or hold the text and choose Copy.";
  };
  menu.querySelector("#savePreset").onclick = () => {
    if (state.screen === 4) { saveStationLayout(); menu.remove(); return; }
    if (state.screen !== 1) return;
    const name = prompt("Name this door-page layout");
    if (!name) return;
    const page = captureDoorLayout();
    const list = presets();
    list.push({ name, screen: 1, items: page.items, wheel: page.wheel, bg: "mark" });
    writePresets(list);
    saveDoorLayout();
    menu.remove();
  };
  menu.querySelectorAll("[data-load]").forEach(btn => btn.onclick = () => {
    if (state.screen !== 1) return;
    const item = presets()[btn.dataset.load];
    if (item.screen && item.screen !== 1) return;
    applyItems(item.items);
    if (item.wheel) {
      bgLayer.style.left = item.wheel.left || "50%";
      bgLayer.style.top = item.wheel.top || "42%";
      bgLayer.style.width = item.wheel.width || "88vmin";
      bgLayer.style.opacity = item.wheel.opacity || "0.2";
      bgLayer.style.transform = item.wheel.transform || "translate(-50%, -50%)";
    }
    saveDoorLayout();
    menu.remove();
  });
};
let drag = null;
function point(t) { return { x: t.clientX, y: t.clientY }; }
scatter.addEventListener("pointerdown", (e) => {
  if (document.documentElement.getAttribute("data-adjust") !== "1") return;
  const img = e.target.closest("img");
  if (!img) return;
  scatter.querySelectorAll("img").forEach(el => el.classList.remove("sel"));
  img.classList.add("sel");
  showSize(img);
  drag = { img, x: e.clientX, y: e.clientY, left: parseFloat(img.style.left), top: parseFloat(img.style.top) };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  if (drag.img === bgLayer) {
    drag.img.style.left = "50%";
    drag.img.style.transform = "translate(-50%, -50%)";
    drag.img.style.top = (drag.top + (e.clientY - drag.y) / window.innerHeight * 100) + "%";
    syncWmGrab();
    return;
  }
  drag.img.style.left = (drag.left + (e.clientX - drag.x) / window.innerWidth * 100) + "%";
  drag.img.style.top = (drag.top + (e.clientY - drag.y) / window.innerHeight * 100) + "%";
});
window.addEventListener("pointerup", () => { if (drag && drag.page === 4) saveStationWheels(); drag = null; });
scatter.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2 && e.target.closest("img")) {
    const img = e.target.closest("img");
    drag = null;
    img._pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), size: parseFloat(img.style.width) };
  }
}, { passive: true });
scatter.addEventListener("touchmove", (e) => {
  const img = document.querySelector("#scatter img.sel");
  if (!img || !img._pinch || e.touches.length < 2) return;
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  img.style.width = Math.max(24, img._pinch.size * d / img._pinch.d) + "px";
}, { passive: true });
function stationWheelAt(x, y) {
  const imgs = [...document.querySelectorAll("#stationWheels img")];
  for (let i = imgs.length - 1; i >= 0; i--) {
    const r = imgs[i].getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return imgs[i];
  }
  return null;
}
function startStationWheel(img, e) {
  document.querySelectorAll("#stationWheels img").forEach(el => el.classList.remove("sel"));
  img.classList.add("sel");
  drag = { img, page: 4, x: e.clientX, y: e.clientY, left: parseFloat(img.style.left), top: parseFloat(img.style.top) };
  e.preventDefault();
  e.stopPropagation();
}
document.addEventListener("pointerdown", (e) => {
  if (state.screen !== 4 || document.documentElement.getAttribute("data-adjust") !== "1") return;
  if (e.target.closest(".ver-banner button, .ver-banner input, .ver-banner label, .settings, #layoutMenu, #coordBox, .grab-right")) return;
  const img = stationWheelAt(e.clientX, e.clientY);
  if (!img) return;
  startStationWheel(img, e);
}, true);
document.getElementById("stationWheels").addEventListener("pointerdown", (e) => {
  if (state.screen !== 4 || document.documentElement.getAttribute("data-adjust") !== "1") return;
  const img = e.target.closest("img");
  if (!img) return;
  startStationWheel(img, e);
});
document.getElementById("wmGrab").addEventListener("pointerdown", (e) => {
  if (true) return;
  scatter.querySelectorAll("img").forEach(el => el.classList.remove("sel"));
  bgLayer.classList.add("sel");
  showSize(bgLayer);
  drag = { img: bgLayer, x: e.clientX, y: e.clientY, left: 50, top: parseFloat(bgLayer.style.top) };
  e.preventDefault();
  e.stopPropagation();
});
bgLayer.style.left = "50%";
bgLayer.style.transform = "translate(-50%, -50%)";
bgLayer.addEventListener("touchstart", (e) => {
  if (e.touches.length === 2) {
    drag = null;
    bgLayer._pinch = { d: Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY), size: parseFloat(bgLayer.style.width) };
  }
}, { passive: true });
bgLayer.addEventListener("touchmove", (e) => {
  if (!bgLayer._pinch || e.touches.length < 2) return;
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  bgLayer.style.width = Math.max(20, bgLayer._pinch.size * d / bgLayer._pinch.d) + (bgLayer.style.width.endsWith("vw") ? "vw" : "vmin");
}, { passive: true });
setBackground("mark");
document.documentElement.setAttribute("data-theme", "light");
renderIndex();
render();

const APP_VERSION = "2.85";
(function () {
  const handle = document.getElementById("bannerHandle");
  if (!handle) return;
  handle.addEventListener("click", () => {
    const hidden = document.documentElement.getAttribute("data-banner") === "hide";
    if (hidden) {
      document.documentElement.removeAttribute("data-banner");
      handle.setAttribute("aria-label", "Hide version bar");
    } else {
      document.documentElement.setAttribute("data-banner", "hide");
      handle.setAttribute("aria-label", "Show version bar");
    }
  });
})();

async function loadNewest() {
  if ("serviceWorker" in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map((reg) => reg.unregister()));
  }
  if (window.caches) {
    const keys = await caches.keys();
    await Promise.all(keys.map((key) => caches.delete(key)));
  }
  location.reload();
}

async function checkVersion() {
  try {
    const res = await fetch("version.json?ts=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    if (data.version && data.version !== APP_VERSION) {
      const flash = document.getElementById("verUpdate");
      if (flash) {
        flash.textContent = "New version " + data.version + " is available — tap to load";
        flash.classList.remove("hidden");
      }
      const banner = document.getElementById("updateBanner");
      if (banner) {
        document.getElementById("updateText").textContent = "New version " + data.version + " is available.";
        banner.classList.remove("hidden");
      }
    }
  } catch (err) {}
}

document.getElementById("refreshBtn").onclick = loadNewest;
document.getElementById("updateBtn").onclick = loadNewest;
document.getElementById("verUpdate").onclick = loadNewest;
checkVersion();
setInterval(checkVersion, 10000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
