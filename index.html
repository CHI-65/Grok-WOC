<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8a3d2a">
<meta name="description" content="Wheel of Creativity scaffolding. Illumination journey and full-course review.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wheel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Wheel of Creativity — Scaffolding</title>
<style>
  :root {
    --bg: #f6f1e8;
    --ink: #1c1612;
    --muted: #4a4038;
    --card: #fffaf3;
    --line: #2a211b;
    --accent: #8a3d2a;
    --accent-ink: #fff8f4;
    --focus: #0b5cab;
    --placeholder: #6b4e1e;
    --pay: #5c2a4a;
    --ok: #1e5c3a;
    --shadow: 0 1px 0 rgba(28,22,18,0.06);
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg: #16130f;
    --ink: #f6efe6;
    --muted: #d4c7b8;
    --card: #241e18;
    --line: #f0e6da;
    --accent: #e07a62;
    --accent-ink: #1c1210;
    --focus: #ffd36a;
    --placeholder: #e6c27a;
    --pay: #f0b4d4;
    --ok: #8fd9ae;
    --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    user-select: none; -webkit-user-select: none;
    text-align: center;
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    background-color: var(--bg);
    background-image: none;
    color: var(--ink);
    font-size: 20px;
    line-height: 1.45;
    min-height: 100vh;
  }
  /* iPad / large portrait: max size that fits, same aspect as iPhone, no crop */
  @media (min-width: 500px) and (orientation: portrait) {
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    body {
      width: 393px;
      height: 852px;
      transform: scale(min(calc(100vw / 393px), calc(100dvh / 852px)));
      transform-origin: center center;
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -196.5px;
      margin-top: -426px;
    }
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url("images/wheel-mark.png") center / contain no-repeat;
    opacity: 0.2;
    pointer-events: none;
    z-index: 0;
  }
