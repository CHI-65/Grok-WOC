  { id: 8, quarter: "Incubation", name: "Gestation", adjective: "Doubtful", noun: "Doubt", challenge: "Doubt", feels: ["like you're just sitting and watching time pass", "you're waiting and trying to trust without any proof yet", "everything's dark and quiet - worried nothing's happening"], phrase: "Sitting on the dock of the bay.", experience: "Urgency", task: "Relax", reward: "Faith", direction: "Faith" },
  { id: 9, quarter: "Incubation", name: "Breakthrough", adjective: "Perfectionistic", noun: "Perfectionism", challenge: "Perfectionism", feels: ["like something new has been born - is it good enough?", "not ready to share it", "on the edge of birth but not sure it's time", "can't push it, can't stop it either"], phrase: "Free at last!", experience: "Appreciation", task: "Be present", reward: "Confidence", direction: "Confidence" },
  { id: 10, quarter: "Cultivation", name: "Nurturing", adjective: "Pressured", noun: "Pressure", challenge: "Pressure", feels: ["in love with your work", "responsible for keeping something fragile from breaking", "tempted to share something too soon - a need to push through too quickly - you have to make something with it"], phrase: "Someone to watch over you.", experience: "Tenderness", task: "Protect", reward: "Maturity", direction: "Maturity" },
  { id: 11, quarter: "Cultivation", name: "Pruning", adjective: "Fatigued", noun: "Fatigue", challenge: "Fatigue", feels: ["like it's time to let go of what doesn't fit", "the need to cut things away, even the parts you love", "worn down by all the iterations", "it's still not quite right"], phrase: "Time to say goodbye.", experience: "Fatigue", task: "Discipline", reward: "Mastery", direction: "Mastery" },
  { id: 12, quarter: "Cultivation", name: "Harvest", adjective: "Resistant", noun: "Resistance", challenge: "Resistance", feels: ["like you're finally bringing it home", "not ready to call it finished and celebrate", "the cutting's done, but you haven't celebrated yet - afraid to send it out into the world - reluctant to let it go"], phrase: "Homeward bound.", experience: "Satisfaction", task: "Release", reward: "Purpose", direction: "Purpose" }
];

const SCREENS = [
  { n: 1, name: "Two-Door Entry", paid: false },
  { n: 2, name: "Felt-Word Grid", paid: false },
  { n: 3, name: "Discovery Draw", paid: false },
  { n: 4, name: "Recognition", paid: false },
  { n: 5, name: "Illumination", paid: false },
  { n: 6, name: "Wheel Map", paid: false },
  { n: 7, name: "Go Deeper Prompt", paid: false },
  { n: 8, name: "Email Capture", paid: false },
  { n: 9, name: "Unlock Offer", paid: true },
  { n: 10, name: "Purchase / Checkout", paid: true },
  { n: 11, name: "Welcome / Course Home", paid: true }
];

const state = {
  screen: 1,
  history: [],
  door: null,
  pick: null,
  stationId: 1,
  design: null,
  spinning: false,
  emailNote: "",
  mapOpen: false,
  mapLit: 0
};

const main = document.getElementById("main");
const index = document.getElementById("index");

function stationById(id) { return STATIONS.find(s => s.id === id); }
function stationBorderColor(id) {
  // Q1 Vision (Hunger, Appetite, Anorexia): yellow
  if (id <= 3) return "#e2b000";
  // Q2 Exploration (Launch, Isolation, Crisis): Rubine red
  if (id <= 6) return "#d4145a";
  // Q3 Incubation (Conception, Gestation, Breakthrough): blue
  if (id <= 9) return "#2b6fd6";
  // Q4 Cultivation (Nurturing, Pruning, Harvest): green
  return "#2f9e38";
}
function stationFillColor(id) {
  if (id <= 3) return "rgba(226, 176, 0, 0.16)";
  if (id <= 6) return "rgba(212, 20, 90, 0.12)";
  if (id <= 9) return "rgba(43, 111, 214, 0.13)";
  return "rgba(47, 158, 56, 0.13)";
}

function go(n, push) {
  leaveAdjust();
  if (push !== false && state.screen !== n) state.history.push(state.screen);
  state.screen = n;
  render();
  window.scrollTo(0, 0);
  const h = document.querySelector("h1");
  if (h) h.focus();
}

function back() {
  leaveAdjust();
  if (state.mapOpen) { state.mapOpen = false; render(); return; }
  if (!state.history.length) return;
  state.screen = state.history.pop();
  render();
}

function leaveAdjust() {
  document.documentElement.removeAttribute("data-adjust");
  const menu = document.getElementById("layoutMenu");
  if (menu) menu.remove();
}

function render() {
  const s = SCREENS[state.screen - 1];
  const st = stationById(state.stationId);
  document.getElementById("backBtn").disabled = state.history.length === 0 && !state.mapOpen;
  let html = "";
  if (s.n === 9) {
    html += '<div class="paywall"><strong>Paywall boundary.</strong> Free illumination journey ends here. What follows is the paid full course. This is a review divider, not a real charge.</div>';
  }
  if (s.n === 1) {
    html += '<h1 tabindex="-1">Hey there, Human!</h1><p>What\'s going on with you? How are you feeling right now?</p><div class="cta-gap"><button type="button" id="doorFeel" class="tap-text">I feel</button></div><p class="muted">Tap to name your feeling</p>';
  }
  if (s.n === 2) {
    html += '<h1 tabindex="-1">I feel…</h1><p>Tap a feeling to explore</p><div class="grid" id="wordGrid"></div><p class="wish-line">I wish I knew what I was feeling</p><div class="cta-gap"><button type="button" id="doorOff" class="help-btn">Help me</button></div>';
  }
  if (s.n === 3) {
    state.design = 3;
    state.spinning = false;
    html += '<h1 tabindex="-1">Catch a wheel</h1><p>Tap any wheel to try on a feeling.</p><div class="float-stage" id="drawGrid"></div>';
  }
  if (s.n === 4) {
    const feels = (st.feels || []).map(f => "<li>" + f + "</li>").join("");
    html += '<h1 class="locked-title" tabindex="-1">You\'ve chosen the ' + st.noun + ' card.</h1><div id="cardScroll"><div class="cardish rec-card" id="recCard" style="border-color:' + stationBorderColor(st.id) + '; background:' + stationFillColor(st.id) + ';"><div class="card-wheels"></div><p>' + st.noun + ' can leave you feeling:</p><ul>' + feels + '</ul><p>These are all symptoms of being out of alignment with your personal creative process. This is what happens to all of us when we\'re not in our creative flow.</p><p>And when you look at the map of your creative process, ' + st.noun + ' is just outside…</p></div><div class="cta-follow"><span class="tap-text" id="toWheel" role="button" tabindex="0">See where you are</span></div><p class="muted" style="margin:0.6em 0 0.2em">Not quite sure if this fits?</p><div class="cta-gap"><button type="button" id="chooseAnother" class="help-btn">Choose another card</button></div></div>';
  }
  if (s.n === 5) {
    html += '<h1 tabindex="-1">Illumination</h1><p>' + st.phrase + '</p><p>Experience: ' + st.experience + '</p><p>Task: ' + st.task + '</p><p>Reward: ' + st.reward + '</p>';
  }
  if (s.n === 6) {
    html += '<h1 tabindex="-1">You are here</h1><p>' + st.noun + ' sits just outside <strong>' + st.name + '</strong>. The rest of the wheel is visible. Only this station is open.</p><div class="wheel" id="wheel"><div class="wheel-center">You are here<br>' + st.name + '</div></div><div class="cta-gap"><span class="tap-text" id="toIllum" role="button" tabindex="0">See illumination</span></div>';
  }
  if (s.n === 7) {
    html += '<h1 tabindex="-1">Go deeper</h1><p>For <strong>' + st.name + '</strong>, the full course still holds:</p>';
    html += '<div class="ph">Held back: A teaching video and a worksheet for this station. They live in the full course, not in this free illumination.</div>';
    html += '<div class="row"><button class="primary" type="button" id="toEmail">Continue</button></div>';
  }
  if (s.n === 8) {
    html += '<h1 tabindex="-1">Email capture</h1><p>Optional. If you enter an email, this scaffolding would tag it with <strong>' + st.name + '</strong>. Nothing is sent or stored.</p>';
    html += '<form id="emailForm"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com"><div class="row"><button class="primary" type="submit">Submit email</button><button type="button" id="skipEmail">Skip</button></div></form>';
  }
  main.innerHTML = html;
  document.documentElement.setAttribute("data-page", s.n === 4 ? "recognition" : s.n === 5 ? "illum" : s.n === 6 ? "station" : "other");
  document.documentElement.setAttribute("data-bg", "mark");
  if (s.n === 2) {
    const g = document.getElementById("wordGrid");
    STATIONS.forEach(item => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "door";
      b.textContent = item.adjective;
      b.onclick = () => chooseStation(item.id, item.adjective, "know");
      g.appendChild(b);
    });
    const doorOff = document.getElementById("doorOff"); if (doorOff) doorOff.onclick = () => { state.door = "off"; state.design = 3; go(3); };
    const chooseAnother = document.getElementById("chooseAnother"); if (chooseAnother) chooseAnother.onclick = () => { go(2); };
  }
  if (s.n === 1) {
    document.getElementById("doorFeel").onclick = () => { state.door = "know"; go(2); };
  }
  if (s.n === 4) {
    document.getElementById("toWheel").onclick = () => go(6);
  }
  if (s.n === 6) {
    document.getElementById("toIllum").onclick = () => go(5);
  }
  if (s.n === 7) {
    document.getElementById("toEmail").onclick = () => go(8);
  }
}

function chooseStation(id, pick, door) {
  state.stationId = id;
  state.pick = pick;
  state.door = door;
  go(4);
}

document.getElementById("backBtn").onclick = back;
document.getElementById("homeBtn").onclick = () => { state.history = []; go(1, false); };
document.getElementById("menuBtn").onclick = () => {
  const s = document.getElementById("settings");
  s.hidden = !s.hidden;
};
document.getElementById("themeBtn").onclick = () => {
  const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
};
document.getElementById("logLink").onclick = () => { window.location.href = "timelog.html"; };

fetch("version.json").then(r => r.json()).then(v => { document.getElementById("ver").textContent = v.version; }).catch(() => {});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
render();
</script>
</body>
</html>
