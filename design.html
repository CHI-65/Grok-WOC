<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card design — Wheel of Creativity</title>
<style>
  :root { --bg:#f6f1e8; --ink:#1c1612; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 20px/1.45 Georgia, "Iowan Old Style", Palatino, serif; }
  body { padding: 58px 0 24px; }
  h1 { font-size: 22px; margin: 4px 0 2px; text-align: center; }
  .ver { text-align: center; font-weight: 700; color: #e2b000; margin: 0 0 8px; }
  .note { text-align: center; color: #4a4038; font-size: 14px; margin: 0 0 12px; }
  .stage { width: 393px; max-width: 100%; margin: 0 auto; padding: 0 16px; touch-action: pan-y; }
  .card {
    position: relative; width: 303px; max-width: 100%; margin: 8px auto;
    border: 2px solid #e2b000; border-radius: 14px;
    background: rgba(226, 176, 0, 0.16); padding: 12px; overflow: hidden;
  }
  .wheels { position: absolute; inset: 0; z-index: 0; }
  .wheels img {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    touch-action: none; -webkit-user-drag: none;
  }
  .wheels img.sel { outline: 2px solid #e2b000; outline-offset: 2px; border-radius: 50%; }
  .copy { position: relative; z-index: 1; pointer-events: none; text-align: center; }
  .card-title { margin: 8px 0 12px; font-size: 34px; line-height: 1.15; text-align: center; }
  .copy p { margin: 0 0 12px; }
  .copy ul { text-align: left; margin: 8px auto; padding-left: 1.2em; max-width: 28em; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    background: #1c1612; color: #fff8f4;
    padding: 28px 14px 16px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
  }
  .bar.hide { transform: translateY(calc(100% - 26px)); }
  .chev {
    position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
    width: 64px; height: 22px; border-radius: 11px; background: #ffd36a; color: #1c1612;
    display: flex; align-items: center; justify-content: center; padding: 0; min-height: 0;
  }
  .chev svg { width: 18px; height: 18px; }
  .bar.hide .chev svg { transform: rotate(180deg); }
  .bar button, .bar label { color: #ffd36a; font: 700 16px/1.2 Georgia, serif; background: transparent; border: 0; }
  .bar button { min-height: 36px; padding: 6px 10px; }
  #addBtn { font-size: 28px; width: 44px; height: 44px; border-radius: 50%; background: #ffd36a; color: #1c1612; }
  input[type="range"] { width: 120px; }
  .hidden { display: none; }
  .group { text-align: center; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 6px; }
  .menu-btn {
    position: fixed; top: 10px; right: 12px; z-index: 8;
    width: 44px; height: 44px; border: 0; background: transparent; padding: 8px;
  }
  .menu-btn span { display: block; height: 3px; margin: 5px 0; background: #1c1612; border-radius: 2px; }
  .menu {
    position: fixed; top: 56px; right: 12px; z-index: 8;
    background: #fffaf3; border: 2px solid #1c1612; border-radius: 12px; min-width: 160px;
    display: none; overflow: hidden;
  }
  .menu.open { display: block; }
  .menu button { display: block; width: 100%; text-align: left; background: transparent; border: 0; padding: 12px 14px; font: 700 18px/1.2 Georgia, serif; color: #1c1612; }
  .menu-label { margin: 8px 14px 0; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #4a4038; }
  .menu button.on { background: #efe6d6; }
  .grid {
    position: absolute; inset: 0; z-index: 2; pointer-events: none; display: none;
    background:
      linear-gradient(to right, transparent calc(50% - 1.5px), #1c1612 calc(50% - 1.5px), #1c1612 calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      linear-gradient(to bottom, transparent calc(50% - 1.5px), #1c1612 calc(50% - 1.5px), #1c1612 calc(50% + 1.5px), transparent calc(50% + 1.5px)),
      repeating-linear-gradient(to right, rgba(28,22,18,0.28) 0 1px, transparent 1px 8.33%),
      repeating-linear-gradient(to bottom, rgba(28,22,18,0.28) 0 1px, transparent 1px 8.33%);
  }
  .grid.on { display: block; }
  body.hide-text .copy, body.hide-text .card-title { visibility: hidden; }
  .card-wrap { position: relative; width: 303px; max-width: 100%; margin: 8px auto; transform-origin: center top; }
  .card { margin: 0 auto; }
  .undo-btn, .lock {
    position: fixed; top: 10px; z-index: 8;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid #1c1612; background: #fffaf3; color: #1c1612;
    padding: 0; min-height: 0; display: flex; align-items: center; justify-content: center;
  }
  .undo-btn { left: 64px; }
  .undo-btn svg { width: 18px; height: 18px; }
  .lock {
    left: 12px;
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid #1c1612; background: #fffaf3; color: #1c1612;
    padding: 0; min-height: 0; display: flex; align-items: center; justify-content: center;
  }
  .lock svg { width: 14px; height: 14px; }
  .lock.on { background: #1c1612; color: #ffd36a; }
</style>
</head>
<body>
<button type="button" class="undo-btn" id="undoIcon" aria-label="Undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 9h10a6 6 0 1 1 0 12H9" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<button type="button" class="lock" id="lockBtn" aria-label="Lock this card"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
<button type="button" class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
<div class="menu" id="menu">
  <p class="menu-label">Card</p>
  <button type="button" data-card="0">Green</button>
  <button type="button" data-card="1">Gold</button>
  <button type="button" data-card="2">Blue</button>
  <button type="button" data-card="3">Red</button>
  <button type="button" id="undoBtn">Undo</button>
  <button type="button" id="defaultBtn">Default</button>
  <button type="button" id="gridBtn">Show grid</button>
  <button type="button" id="hideTextBtn">Hide text</button>
</div>
<h1>Card design</h1>
<p class="ver">Design 1.14</p>
<p class="note">Choose the card from the menu. Each keeps its own design.</p>
<div class="stage" id="stage">
  <p class="group" id="groupName"></p>
  <h2 class="card-title" id="cardTitle"></h2>
  <div class="card-wrap">
  <div class="card" id="card">
    <div class="wheels" id="wheels"></div>
    <div class="grid" id="grid"></div>
    <div class="copy" id="copy"></div>
  </div>
  </div>
</div>
<div class="bar" id="bar">
  <button type="button" class="chev" id="chev" aria-label="Hide design bar"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button type="button" id="addBtn" aria-label="Add a wheel">+</button>
  <label id="sizeLabel" class="hidden">Size <input id="size" type="range" min="12" max="420" value="220"></label>
  <label id="opLabel" class="hidden">Opacity <input id="op" type="range" min="5" max="80" value="11"></label>
  <button type="button" id="delBtn" class="hidden">Remove</button>
  <button type="button" id="copyBtn">Copy design</button>
</div>
<script>
const GROUPS = [
  { key: "green", name: "Green", color: "#2f9e38", fill: "rgba(47,158,56,0.13)", cards: [
    { noun: "Uncertainty", feels: ["like something's missing", "restless", "restless or dissatisfied, not sure why"] },
    { noun: "Vagueness", feels: ["like I know what I want", "that's what I want", "wanting it, even if I can't explain why"] },
    { noun: "Inertia", feels: ["paralyzed", "like something in me says \"don't you dare\"", "stuck behind my own line"] }
  ]},
  { key: "gold", name: "Gold", color: "#e2b000", fill: "rgba(226,176,0,0.16)", cards: [
    { noun: "Burnout", feels: ["burned out", "running on fumes", "used up all my launch energy"] },
    { noun: "Distraction", feels: ["like there's nothing out here", "scattered and alone", "like I need a ground crew"] },
    { noun: "Overwhelm", feels: ["like everything's against me", "in full panic", "barely holding on"] }
  ]},
  { key: "blue", name: "Blue", color: "#2b6fd6", fill: "rgba(43,111,214,0.13)", cards: [
    { noun: "Shock", feels: ["thrown into something brand new", "caught off guard, no footing yet"] },
    { noun: "Doubt", feels: ["like I'm waiting and don't know for what", "doubting it'll work out"] },
    { noun: "Perfectionism", feels: ["still not good enough to call finished", "can't let it be done, not free yet"] }
  ]},
  { key: "red", name: "Red", color: "#d4145a", fill: "rgba(212,20,90,0.12)", cards: [
    { noun: "Pressure", feels: ["like I'm carrying something fragile", "under the weight of watching over it"] },
    { noun: "Fatigue", feels: ["fatigued", "worn down from cutting things back", "tired of saying goodbye"] },
    { noun: "Resistance", feels: ["dragging my feet toward the finish", "not ready to come home yet"] }
  ]}
];
const wheels = document.getElementById("wheels");
const size = document.getElementById("size");
const op = document.getElementById("op");
const sizeLabel = document.getElementById("sizeLabel");
const opLabel = document.getElementById("opLabel");
const delBtn = document.getElementById("delBtn");
const bar = document.getElementById("bar");
let gi = 0;
let designs = {};
let sel = 0;
let drag = null;
let history = { green: [], gold: [], blue: [], red: [] };
let locks = {};
let views = { green: {}, gold: {}, blue: {}, red: {} };
let zoom = { green: 1, gold: 1, blue: 1, red: 1 };
const ORIGINAL = [{ id: 1, x: 50, y: 46, size: 220, opacity: 0.11, center: true }];
function key() { return GROUPS[gi].key; }
function snapshot() {
  const stack = history[key()];
  stack.push(JSON.stringify(designs[key()]));
  if (stack.length > 4) stack.shift();
}

function pick() {
  const saved = JSON.parse(localStorage.getItem("woc-design-picks") || "null");
  if (saved) return saved;
  const picks = GROUPS.map(g => Math.floor(Math.random() * g.cards.length));
  localStorage.setItem("woc-design-picks", JSON.stringify(picks));
  return picks;
}
const picks = pick();
function items() { return designs[GROUPS[gi].key]; }
function load() {
  designs = JSON.parse(localStorage.getItem("woc-card-designs") || "null") || {};
  locks = JSON.parse(localStorage.getItem("woc-design-locks") || "null") || {};
  GROUPS.forEach(g => {
    if (!designs[g.key]) designs[g.key] = [{ id: 1, x: 50, y: 46, size: 220, opacity: 0.11, center: true }];
  });
}
function locked() { return !!locks[GROUPS[gi].key]; }
function save() { localStorage.setItem("woc-card-designs", JSON.stringify(designs)); }
function saveLocks() { localStorage.setItem("woc-design-locks", JSON.stringify(locks)); }
function undo() {
  const stack = history[key()];
  if (!stack.length) return;
  designs[key()] = JSON.parse(stack.pop());
  sel = 0;
  draw();
}
function showCard() {
  const g = GROUPS[gi];
  const card = g.cards[picks[gi]];
  document.getElementById("groupName").textContent = g.name;
  document.getElementById("cardTitle").textContent = "You've chosen the " + card.noun + " card.";
  document.getElementById("card").style.borderColor = g.color;
  document.getElementById("card").style.background = g.fill;
  document.getElementById("copy").innerHTML = "<p>" + card.noun + " can leave you feeling:</p><ul>" + card.feels.map(f => "<li>" + f + "</li>").join("") + "</ul><p>These are all symptoms of being out of alignment with your personal creative process. This is what happens to all of us when we're not in our creative flow.</p><p>And when you look at the map of your creative process, " + card.noun + " is just outside…</p>";
}
function draw() {
  showCard();
  const v = views[key()];
  document.getElementById("grid").classList.toggle("on", !!v.grid);
  document.body.classList.toggle("hide-text", !!v.hide);
  document.getElementById("gridBtn").textContent = v.grid ? "Hide grid" : "Show grid";
  document.getElementById("hideTextBtn").textContent = v.hide ? "Show text" : "Hide text";
  document.querySelectorAll("[data-card]").forEach(b => b.classList.toggle("on", +b.dataset.card === gi));
  document.querySelector(".card-wrap").style.transform = "scale(" + (zoom[key()] || 1) + ")";
  const lockBtn = document.getElementById("lockBtn");
  lockBtn.classList.toggle("on", locked());
  lockBtn.setAttribute("aria-label", locked() ? "Unlock this card" : "Lock this card");
  wheels.innerHTML = "";
  items().forEach((item, i) => {
    const img = document.createElement("img");
    img.src = "images/wheel-mark.png";
    img.alt = "";
    img.style.left = item.x + "%";
    img.style.top = item.y + "%";
    img.style.width = item.size + "px";
    img.style.opacity = item.opacity;
    if (i === sel) img.classList.add("sel");
    img.addEventListener("pointerdown", (e) => startDrag(e, i));
    wheels.appendChild(img);
  });
  const on = items()[sel];
  sizeLabel.classList.toggle("hidden", !on);
  opLabel.classList.toggle("hidden", !on);
  delBtn.classList.toggle("hidden", !on || on.center);
  if (on) { size.value = itemSize(on); op.value = Math.round(on.opacity * 100); }
  save();
}
function itemSize(item) { return Math.max(12, item.size); }
function startDrag(e, i) {
  if (locked()) return;
  sel = i;
  const img = e.currentTarget;
  const r = wheels.getBoundingClientRect();
  drag = { i, dx: e.clientX - img.getBoundingClientRect().left, dy: e.clientY - img.getBoundingClientRect().top, r };
  img.setPointerCapture(e.pointerId);
  wheels.querySelectorAll("img").forEach((el, n) => el.classList.toggle("sel", n === i));
}
wheels.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const item = items()[drag.i];
  item.x = Math.max(-10, Math.min(110, ((e.clientX - drag.dx + item.size / 2 - drag.r.left) / drag.r.width) * 100));
  item.y = Math.max(-10, Math.min(110, ((e.clientY - drag.dy + item.size / 2 - drag.r.top) / drag.r.height) * 100));
  const img = wheels.children[drag.i];
  if (img) { img.style.left = item.x + "%"; img.style.top = item.y + "%"; }
});
wheels.addEventListener("pointerdown", () => snapshot(), true);
wheels.addEventListener("pointerup", () => { if (drag) save(); drag = null; });
snapshot();
function addWheel(copy) {
  if (locked()) return;
  const list = items();
  const src = list[sel];
  const base = copy && src ? src : { size: 90, opacity: 0.2 };
  list.push({ id: Date.now(), x: Math.min(90, (src ? src.x : 40) + 8), y: Math.min(90, (src ? src.y : 30) + 8), size: base.size, opacity: base.opacity, center: false });
  sel = list.length - 1;
  draw();
}
const addBtn = document.getElementById("addBtn");
let hold = null, held = false;
addBtn.addEventListener("pointerdown", () => { held = false; hold = setTimeout(() => { held = true; addWheel(true); }, 450); });
addBtn.addEventListener("pointerup", () => { clearTimeout(hold); if (!held) addWheel(false); held = false; });
addBtn.addEventListener("pointerleave", () => clearTimeout(hold));
snapshot();
size.oninput = () => { if (items()[sel]) { items()[sel].size = +size.value; draw(); } };
snapshot();
op.oninput = () => { if (items()[sel]) { items()[sel].opacity = +op.value / 100; draw(); } };
snapshot();
delBtn.onclick = () => { if (locked()) return; if (items()[sel] && !items()[sel].center) { items().splice(sel, 1); sel = 0; draw(); } };
document.getElementById("copyBtn").onclick = async () => {
  const text = JSON.stringify({ group: GROUPS[gi].key, card: GROUPS[gi].cards[picks[gi]].noun, wheels: items() }, null, 2);
  try { await navigator.clipboard.writeText(text); alert("This color's design copied."); }
  catch (e) { prompt("Copy this design:", text); }
};
document.getElementById("menuBtn").onclick = () => document.getElementById("menu").classList.toggle("open");
document.getElementById("undoBtn").onclick = () => { undo(); document.getElementById("menu").classList.remove("open"); };
document.getElementById("defaultBtn").onclick = () => {
  snapshot();
  designs[key()] = JSON.parse(JSON.stringify(ORIGINAL));
  sel = 0;
  draw();
  document.getElementById("menu").classList.remove("open");
};
document.getElementById("gridBtn").onclick = () => {
  views[key()].grid = !views[key()].grid;
  draw();
  document.getElementById("menu").classList.remove("open");
};
document.getElementById("hideTextBtn").onclick = () => {
  views[key()].hide = !views[key()].hide;
  draw();
  document.getElementById("menu").classList.remove("open");
};
document.getElementById("lockBtn").onclick = () => {
  locks[GROUPS[gi].key] = !locked();
  saveLocks();
  draw();
};
document.getElementById("chev").onclick = () => {
  bar.classList.toggle("hide");
  document.getElementById("chev").setAttribute("aria-label", bar.classList.contains("hide") ? "Show design bar" : "Hide design bar");
};
document.querySelectorAll("[data-card]").forEach(b => b.onclick = () => {
  gi = +b.dataset.card;
  sel = 0;
  draw();
  document.getElementById("menu").classList.remove("open");
});
document.getElementById("undoIcon").onclick = () => undo();
const wrap = document.querySelector(".card-wrap");
let pinch = null;
const touches = new Map();
wrap.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".wheels img") || drag) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
wrap.addEventListener("pointermove", (e) => {
  if (drag || !touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size < 2) return;
  const [a, b] = [...touches.values()];
  const dist = Math.hypot(a.x - b.x, a.y - b.y);
  if (!pinch) pinch = { dist, scale: zoom[key()] || 1 };
  zoom[key()] = Math.min(3, Math.max(1, pinch.scale * dist / pinch.dist));
  wrap.style.transform = "scale(" + zoom[key()] + ")";
});
function endPinch(e) { touches.delete(e.pointerId); if (touches.size < 2) pinch = null; }
wrap.addEventListener("pointerup", endPinch);
wrap.addEventListener("pointercancel", endPinch);
document.addEventListener("contextmenu", (e) => e.preventDefault());
load();
draw();
</script>
</body>
</html>
