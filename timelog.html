<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8a3d2a">
<title>Time log — Wheel of Creativity</title>
<style>
  :root { --bg:#f6f1e8; --ink:#1c1612; --muted:#4a4038; --card:#fffaf3; --line:#2a211b; --accent:#8a3d2a; --focus:#0b5cab; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Georgia, "Iowan Old Style", Palatino, serif; background:var(--bg); color:var(--ink); font-size:20px; line-height:1.45; }
  .wrap { max-width:760px; margin:0 auto; padding:16px 16px 48px; }
  a { color:var(--accent); }
  h1 { font-size:34px; line-height:1.15; margin:8px 0 12px; }
  p { margin:0 0 12px; }
  .muted { color:var(--muted); }
  .total { border:3px solid var(--line); background:var(--card); border-radius:14px; padding:14px; font-size:28px; font-weight:700; }
  .back { display:inline-flex; align-items:center; min-height:56px; padding:12px 16px; border:2px solid var(--line); border-radius:12px; text-decoration:none; color:var(--ink); font-weight:700; background:var(--card); }
</style>
</head>
<body>
<div class="wrap">
  <p><a class="back" href="index.html">Back to the app</a></p>
  <h1>Time log</h1>
  <p class="muted">Time spent on this app.</p>
  <p class="total">10 hours 12 minutes</p>
  <p class="muted">Includes the Zoom call, version 1.5, and 17 clustered app sessions.</p>
</div>
</body>
</html>
